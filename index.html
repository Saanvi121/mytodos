<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3a2a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cosy to-dos">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈‍⬛</text></svg>">
<title>Saanvi's cosy to-dos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#3a2a22;--bg2:#4a362b;--card:#45332a;--ink:#f6e7d6;--soft:#cdb29a;--accent:#f0a46a;--accent2:#7a4f35;--line:#5a4334;--shadow:rgba(0,0,0,.35);--blob1:#6b4630;--blob2:#5a3a3a;--blob3:#5e4a2c;--warn:#e9806b}
*{box-sizing:border-box}
html{color-scheme:dark}
html.light{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;transition:background .8s,color .8s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.blob{position:fixed;border-radius:50%;filter:blur(48px);opacity:.5;z-index:0;pointer-events:none;animation:drift 24s ease-in-out infinite alternate;transition:background .8s}
.b1{width:360px;height:360px;background:var(--blob1);top:-90px;left:-110px}.b2{width:300px;height:300px;background:var(--blob2);bottom:-80px;right:-60px;animation-delay:-9s}.b3{width:220px;height:220px;background:var(--blob3);top:40%;left:55%;animation-delay:-15s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.2s}
html.dark .stars{opacity:1}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.season{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-40px;animation:fall linear forwards;opacity:.75}
@keyframes fall{to{transform:translate(var(--sx),112vh) rotate(var(--sr))}}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#f7e48a;box-shadow:0 0 10px 3px rgba(247,228,138,.55);animation:fly 10s ease-in-out forwards;opacity:0}
@keyframes fly{20%{opacity:.9}50%{transform:translate(var(--sx),-60px);opacity:.3}80%{opacity:.9}100%{transform:translate(calc(var(--sx)*-1),-120px);opacity:0}}
button,input,select,textarea{font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0;line-height:1.15}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:22px 20px 150px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.hello h1{font-size:30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hello .nm{outline:none;border-radius:8px;padding:0 3px;cursor:text}
.hello .nm:hover{background:var(--bg2)}.hello .nm:focus{background:var(--bg2);box-shadow:0 0 0 2px var(--accent2)}
.clock{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:2px 11px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px;vertical-align:1px}
.clock .col{animation:tw 2s steps(1) infinite}
.clock small{color:var(--soft);font-size:12.5px;font-weight:600}
.hello .date{font-family:Fredoka,Nunito,sans-serif;font-weight:500;font-size:17px;color:var(--soft);margin-top:2px}
.tools{display:flex;gap:3px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--card) 85%,transparent);border:1.5px solid var(--line);box-shadow:0 8px 22px -12px var(--shadow);align-items:center;flex-wrap:wrap}
.tools button{border:none;background:transparent;font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center;position:relative}
.tools button:hover{background:var(--bg2)}.tools button:disabled{opacity:.35;cursor:default}
.tools .ai-btn{background:var(--accent);color:var(--card)}.tools .ai-btn:hover{background:var(--accent);filter:brightness(1.06)}
.tools .playing::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:tw 1.6s infinite}
.status{font-size:12px;color:var(--soft);padding:0 10px;white-space:nowrap}
@media(max-width:760px){.tools .lbl{display:none}.status{display:none}}

/* coming up strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;margin:-6px 0 8px;scrollbar-width:thin}
.imp{flex:none;width:168px;min-height:118px;border-radius:22px;padding:13px 15px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;
  box-shadow:0 10px 24px -16px var(--shadow);transition:transform .2s,background .8s,border-color .8s;position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;animation:in .35s ease both}
.imp:hover{transform:translateY(-3px) rotate(-.6deg)}
.imp .ie{font-size:22px;line-height:1}
.imp .it{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:15.5px;line-height:1.2;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.imp .iw{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:21px;color:var(--accent);margin-top:auto;line-height:1.1}
.imp .id{font-size:12px;font-weight:700;color:var(--soft)}
.imp.soon{border-color:var(--accent)}
.imp.soon::after{content:"";position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:tw 1.6s infinite}
.imp.now{background:var(--accent);border-color:var(--accent);color:var(--card)}
.imp.now .iw,.imp.now .id{color:var(--card)}
.imp.addimp{border-style:dashed;border-color:var(--accent2);background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--soft);font-weight:700;font-size:14px;width:150px;box-shadow:none}
.imp.addimp b{font-size:24px;display:block;font-weight:600;color:var(--accent)}
.impform input[type=text],.impform textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:15px}
.impform textarea{min-height:60px;resize:vertical;font-size:14px}
.impform .two{display:flex;gap:8px;margin:10px 0}
.impform .two input{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 10px;font-size:14px;min-width:0}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.kinds button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
.kinds button.on{background:var(--accent2);border-color:var(--accent)}
.impform .acts2{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.impform .acts2 button{border:none;border-radius:12px;padding:9px 18px;font-weight:800;cursor:pointer;background:var(--bg2)}
.impform .acts2 .save{background:var(--accent);color:var(--card)}
.impform .pv{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:20px}

/* layout */
.layout>*{min-width:0}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 10px 28px -16px var(--shadow);position:sticky;top:16px;transition:background .8s,border-color .8s}
@media(max-width:760px){.side{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px;border-radius:18px}.side .sep,.side .cap{display:none}}
.nav{font-family:Fredoka,Nunito,sans-serif;font-weight:500;display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:9px 12px;border-radius:14px;cursor:pointer;font-size:15.5px;text-align:left;transition:background .2s;white-space:nowrap}
.nav:hover{background:var(--bg2)}.nav.on{background:var(--accent2)}
.nav .e{font-size:18px;width:22px;text-align:center}.nav .n{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav .c{font-size:12px;background:var(--bg);border-radius:999px;padding:1px 8px;color:var(--soft);font-family:Nunito,sans-serif;font-weight:700}
.nav .c.late{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.nav.drop{outline:2px dashed var(--accent)}
.cap{font-family:Fredoka,Nunito,sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:10px 12px 4px}
.sep{height:1.5px;background:var(--line);margin:8px 6px}
.newlist{color:var(--soft)}

/* main */
.main{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:26px 28px 30px;box-shadow:0 14px 34px -18px var(--shadow);min-height:420px;transition:background .8s,border-color .8s}
@media(max-width:560px){.main{padding:20px 14px}}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.lhead .le{font-size:34px;cursor:pointer;border-radius:12px;padding:0 4px}
.lhead h2{font-size:30px;flex:1;outline:none;border-radius:8px;padding:0 4px}
.lhead h2[contenteditable]:hover,.lhead .le:hover{background:var(--bg)}
.lhead h2:focus{background:var(--bg);box-shadow:0 0 0 2px var(--accent2)}
.lhead .del{border:none;background:transparent;cursor:pointer;color:var(--soft);font-size:14px;padding:6px 10px;border-radius:999px}
.lhead .del:hover{background:var(--bg2)}
.prog{display:flex;align-items:center;gap:10px;font-family:Fredoka,Nunito,sans-serif;font-weight:500;font-size:15px;color:var(--soft);margin:0 0 18px 4px;min-height:8px}
.prog .track{flex:1;max-width:260px;height:9px;background:var(--bg2);border-radius:999px;overflow:hidden}
.prog .fill{height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}

.add{background:var(--bg);border:1.5px dashed var(--accent2);border-radius:20px;padding:8px;margin-bottom:18px}
.addrow{display:flex;gap:6px;align-items:center}
.add input[type=text]{flex:1;min-width:0;border:none;background:transparent;font-size:16px;padding:8px 10px;outline:none}
.add .go{border:none;background:var(--accent);color:var(--card);font-weight:800;border-radius:14px;padding:8px 16px;cursor:pointer}
.mic{border:none;background:var(--bg2);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none;display:grid;place-items:center}
.mic.listening{background:var(--warn);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--warn) 25%,transparent)}}
.preview{display:flex;gap:6px;flex-wrap:wrap;padding:2px 10px 2px;min-height:22px;align-items:center}
.preview .hint{font-size:12.5px;color:var(--soft)}
.preview .hint b{font-weight:700;color:var(--ink);opacity:.8}

.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 10px;border-radius:16px;transition:background .2s;position:relative;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.task:hover{background:var(--bg)}
.task.dragging{opacity:.4}.task.over{box-shadow:inset 0 2px 0 var(--accent)}
.grip{cursor:grab;color:var(--line);font-size:14px;padding-top:4px;user-select:none;width:12px;flex:none}
.task:hover .grip{color:var(--soft)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2.2px solid var(--accent);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--card);font-size:13px;font-weight:900;margin-top:1px;transition:all .2s;padding:0}
.chk:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.task.done .chk{background:var(--accent)}
.task.p-high>.chk{border-color:var(--warn)}
.body{flex:1;min-width:0}
.txt{outline:none;border-radius:6px;padding:1px 4px;margin-left:-4px;word-break:break-word;cursor:text}
.txt:focus{background:var(--card);box-shadow:0 0 0 2px var(--accent2)}
.task.done .txt{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.55}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--bg2);color:var(--soft);white-space:nowrap}
.chip.today{background:var(--accent2);color:var(--ink)}.chip.late{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.chip.hi{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.note{cursor:pointer}
.acts{display:flex;gap:1px;opacity:0;transition:opacity .2s;flex:none}
.task:hover>.acts,.task.open>.acts{opacity:1}
@media(hover:none){.acts{opacity:1}}
.acts button{border:none;background:transparent;cursor:pointer;border-radius:10px;padding:3px 6px;font-size:14px;color:var(--soft)}
.acts button:hover{background:var(--bg2)}
.acts .nt{font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;margin-right:4px;white-space:nowrap}
.acts .nt:hover{border-color:var(--accent);color:var(--ink)}
.task.bye{animation:bye .32s ease forwards}
@keyframes bye{to{opacity:0;transform:translateX(40px)}}
.group .mvall{border:none;background:transparent;color:var(--soft);font:600 12.5px Nunito,sans-serif;cursor:pointer;text-decoration:underline;margin-left:8px}
.group .mvall:hover{color:var(--accent)}
.subs{list-style:none;margin:6px 0 0;padding:0 0 0 2px}
.subs li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14.5px}
.subs .schk{width:17px;height:17px;border-radius:6px;border:2px solid var(--accent);background:transparent;cursor:pointer;flex:none;padding:0;font-size:10px;color:var(--card);font-weight:900;display:grid;place-items:center}
.subs li.d .schk{background:var(--accent)}
.subs li.d .stx{text-decoration:line-through;opacity:.55}
.subs .stx{flex:1;outline:none;border-radius:5px;padding:0 3px;cursor:text}
.subs .stx:focus{background:var(--card);box-shadow:0 0 0 2px var(--accent2)}
.subs .sx{border:none;background:transparent;color:var(--soft);cursor:pointer;opacity:0;font-size:12px}
.subs li:hover .sx{opacity:1}
@media(hover:none){.subs .sx{opacity:1}}
.edit{display:none;margin-top:8px;padding:12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);gap:8px 12px;flex-wrap:wrap;align-items:center}
.task.open .edit{display:flex}
.edit textarea{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);font-size:14px;resize:vertical}
.edit label{font-size:12.5px;font-weight:700;color:var(--soft);display:flex;gap:6px;align-items:center}
.edit input,.edit select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 8px;font-size:13.5px}
.edit .rep{width:170px}
.edit .stepin{flex:1 1 200px}
.notetext{font-size:13.5px;color:var(--soft);margin-top:3px;white-space:pre-wrap}

.donehead{display:flex;align-items:center;gap:10px;margin:18px 0 4px;padding:0 6px}
.donehead button{border:none;background:transparent;cursor:pointer;font-family:Fredoka,Nunito,sans-serif;font-weight:500;font-size:14.5px;color:var(--soft);padding:4px 6px;border-radius:8px}
.donehead button:hover{background:var(--bg2)}
.empty{text-align:center;padding:36px 10px;color:var(--soft)}
.empty .big{font-size:56px;display:block;animation:bob 3s ease-in-out infinite}
.empty .hand{font-family:Fredoka,Nunito,sans-serif;font-weight:500;font-size:19px}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.group{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:15px;color:var(--soft);margin:12px 6px 2px}

/* panels */
.panel{position:fixed;z-index:80;right:18px;bottom:18px;width:min(410px,calc(100vw - 36px));max-height:min(660px,calc(100vh - 40px));display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:26px;box-shadow:0 24px 60px -20px var(--shadow);transform:translateY(20px) scale(.97);opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.2,.9,.3,1.2)}
.panel.open{transform:none;opacity:1;pointer-events:auto}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.panel header h2{font-size:20px}
.panel .close{border:none;background:var(--bg2);border-radius:50%;width:30px;height:30px;cursor:pointer;flex:none}
.pbody{overflow-y:auto;padding:0 20px 20px}
.chat{flex:1;overflow-y:auto;padding:4px 20px 10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{padding:10px 14px;border-radius:18px;font-size:14.5px;max-width:88%;white-space:pre-wrap;animation:in .3s ease both}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--card);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--bg);border:1.5px solid var(--line);border-bottom-left-radius:6px}
.msg.err{background:#fde3df;color:#8a3324;border-color:#f3bdb4}
.undo-link{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;color:var(--accent);cursor:pointer;text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 10px}
.chips button{border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer}
.chips button:hover{background:var(--accent2)}
.ask{display:flex;gap:8px;padding:12px 16px 16px;border-top:1.5px dashed var(--line);align-items:center}
.ask textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;font-size:15px;background:var(--bg);height:52px}
.ask textarea:focus{outline:2px solid var(--accent2)}
.ask .send{border:none;background:var(--accent);color:var(--card);border-radius:16px;padding:0 16px;height:44px;font-weight:800;cursor:pointer}
.ask .send:disabled{opacity:.5}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--soft);animation:typing 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{50%{transform:translateY(-5px);opacity:.4}}
.sect{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:14px 0 8px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border:2px solid transparent;border-radius:18px;padding:11px 12px;cursor:pointer;text-align:left;font-weight:700;font-size:14px;font-family:Fredoka,Nunito,sans-serif;position:relative}
.th.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.th .sw{display:flex;gap:4px;margin-bottom:7px}.th .sw i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.25)}
.th small{display:block;font-family:Nunito,sans-serif;font-weight:600;font-size:11px;opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.row .lb{font-weight:700;font-size:14.5px}
.row .sub{font-size:12.5px;color:var(--soft)}
.tg{width:44px;height:26px;border-radius:999px;border:none;background:var(--bg2);position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.tg.on{background:var(--accent)}.tg.on::after{left:21px}
.periods{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}
.periods div{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12.5px}
.periods div.now{border-color:var(--accent)}
.periods b{display:block;font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:13.5px}
.txtin{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:14px;width:150px}
.snd{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:6px 0}

.master{background:var(--bg);border-radius:16px;padding:10px 14px;margin-bottom:6px}
.stopall{border:none;background:var(--bg2);border-radius:12px;padding:7px 14px;font-weight:700;cursor:pointer;margin-top:8px}

.emopick button:hover{background:var(--accent2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;z-index:95;background:var(--ink);color:var(--card);padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px;transition:all .3s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.pop{position:fixed;pointer-events:none;z-index:96;font-size:18px;animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(.6) rotate(var(--r));opacity:0}}

/* cat */
.cat{position:fixed;left:14px;bottom:6px;z-index:75;width:108px;height:108px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cat svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 35%,transparent)) drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.cat .tail{transform-origin:86px 104px;transform-box:view-box;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(16deg)}}
.cat .bod{transform-origin:60px 118px;transform-box:view-box;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
.cat .eo{transform-origin:60px 54px;transform-box:view-box;transition:transform .07s}
.cat.blink .eo{transform:scaleY(.08)}
.cat .ec{display:none}
.cat.sleep .eo{display:none}.cat.sleep .ec{display:inline}
.cat.sleep .tail{animation-duration:8s}.cat.sleep .bod{animation-duration:6s}
.cat.hop svg{animation:hop .65s ease}
@keyframes hop{30%{transform:translateY(-24px) rotate(-6deg)}60%{transform:translateY(0)}78%{transform:translateY(-7px)}}
.cat.purr svg{animation:purr .1s linear 10}
@keyframes purr{50%{transform:translateX(1px) rotate(.8deg)}}
.zzz{position:absolute;right:2px;top:-4px;font-family:Fredoka,sans-serif;font-weight:600;color:var(--soft);display:none;font-size:15px}
.cat.sleep .zzz{display:block;animation:zz 2.6s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
.bubble{position:absolute;left:84px;bottom:94px;width:max-content;max-width:230px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:16px 16px 16px 4px;font-size:13.5px;font-weight:700;box-shadow:0 8px 20px -8px var(--shadow);opacity:0;transform:translateY(6px) scale(.95);transition:all .25s;pointer-events:none}
.bubble.show{opacity:1;transform:none}
@media(max-width:560px){.cat{width:78px;height:78px}.bubble{left:62px;bottom:70px;max-width:190px}}

.focus{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:20px}

.ftask{font-family:Fredoka,Nunito,sans-serif;font-size:25px;font-weight:600;margin:6px 0 0;word-break:break-word}
.fpick{margin-top:8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:14px;max-width:100%}

.focus.running .cup .steam path{animation:steam 3.2s ease-in-out infinite}
.focus.running .cup .steam path:nth-child(2){animation-delay:1s}.focus.running .cup .steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}40%{opacity:.55}100%{opacity:0;transform:translateY(-18px)}}
.cup .liquid{transition:y .9s linear}

  "\n\nShape: {theme, important:[{id, title, date:'YYYY-MM-DD', time?, kind:'test'|'deadline'|'event'|'other', note?}] (tests & key dates shown as countdown cards), lists:[{id, emoji, name, tasks:[{id, text, done, due?:'YYYY-MM-DD', time?:'HH:MM' 24h, priority?:'high'|'med'|'low', note?, repeat?: plain english like 'every monday' / 'every 3 days' / 'every weekday' / 'every month', subtasks?:[{text,done}], doneOn?}]}]}.\nThemes: "+
  Object.keys(THEMES).map(function(k){return k+" ("+THEMES[k].name+")";}).join(", ")+".\nShe is viewing: "+(cur?"the list \""+cur.name+"\" (id "+cur.id+")":view)+". If she says 'this list' or names no list, use that one (from 'today'/'everything', choose the best-fitting list).\n\n"+
  "She says: \""+req+"\"\n\nRules: change only what she asks; keep every other list and task exactly the same, including ids. New lists/tasks get id \"new\". Turn relative dates/times into real YYYY-MM-DD / HH:MM. Repeating tasks need a due date (the next occurrence). 'Break into steps' means adding subtasks. Keep text short, lowercase-friendly and warm. If she only asks a question or for advice/planning, answer it (you may reference tasks) and change nothing.\n"+
  "Reply with ONLY a JSON object, no code fences:\n{\"message\": \"1-4 short friendly sentences\", \"data\": <the full updated data object, or null if nothing changed>}";}
function extractJSON(t){t=String(t||"");var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("no json");return JSON.parse(t.slice(a,b+1));}
function cleanAI(nd){if(!nd||!Array.isArray(nd.lists))throw new Error("bad");var seen={};
  var L=nd.lists.filter(function(l){return l&&typeof l==="object";}).map(function(l){var id=(l.id&&l.id!=="new"&&!seen[l.id])?String(l.id):uid();seen[id]=1;
    return{id:id,emoji:String(l.emoji||"📝").slice(0,8),name:String(l.name||"list"),tasks:(Array.isArray(l.tasks)?l.tasks:[]).filter(function(t){return t&&String(t.text||"").trim();}).map(function(t){
      var tid=(t.id&&t.id!=="new"&&!seen[t.id])?String(t.id):uid();seen[tid]=1;var tm=/^(\d{1,2}):(\d{2})$/.exec(t.time||"");var rep=parseRepeatStr(t.repeat);
      var due=/^\d{4}-\d{2}-\d{2}$/.test(t.due||"")?t.due:"";if(rep&&!due)due=firstOcc(rep);
      return{id:tid,text:String(t.text),done:!!t.done,due:due,time:tm?pad(+tm[1])+":"+tm[2]:"",priority:["high","med","low"].indexOf(t.priority)>=0?t.priority:"",note:t.note?String(t.note):"",repeat:rep,
        subtasks:Array.isArray(t.subtasks)?t.subtasks.filter(function(s){return s&&String(s.text||"").trim();}).map(function(s){return{id:uid(),text:String(s.text),done:!!s.done};}):[],doneOn:t.done?(t.doneOn||today()):""};})};});
  var out=clone(data);out.lists=L;
  if(Array.isArray(nd.important))out.important=nd.important.filter(function(i){return i&&i.title&&/^\d{4}-\d{2}-\d{2}$/.test(i.date||"");}).map(function(i){var tm=/^(\d{1,2}):(\d{2})$/.exec(i.time||"");
    return{id:(i.id&&i.id!=="new")?String(i.id):uid(),title:String(i.title),date:i.date,time:tm?pad(+tm[1])+":"+tm[2]:"",kind:KINDS[i.kind]?i.kind:(guessKind(String(i.title))||"other"),note:i.note?String(i.note):""};});if(THEMES[nd.theme]&&nd.theme!==themeKey()){if(out.autoTime)out.timeThemes[period()]=nd.theme;else out.theme=nd.theme;}return out;}
function send(){var req=aiInput.value.trim();if(!req||busy)return;
  if(!sampleApi){addMsg("ai","the AI helper isn't available in this view — you can still do everything by hand 🧸","err");return;}
  busy=true;sendBtn.disabled=true;aiInput.value="";addMsg("me",req);
  var ty=$("div","msg ai typing");ty.innerHTML="<span></span><span></span><span></span>";chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;
  sampleApi(buildPrompt(req),{cache:false}).then(function(r){ty.remove();var out=extractJSON(r.text);
    if(out.data){var nd=cleanAI(out.data);snapshot();data=nd;if(view!=="today"&&view!=="all"&&!findList(view))view="today";changed();
      var m=addMsg("ai",(out.message||"done!")+"\n");var u=$("span","undo-link","↶ undo this");u.onclick=function(){undo();u.remove();};m.appendChild(u);catHappy();}
    else addMsg("ai",out.message||"hmm, I'm not sure what to change there.");
  }).catch(function(e){ty.remove();
    if(e&&e.code==="not_granted")addMsg("ai","I need your permission to use AI here — try again and allow it when asked.","err");
    else if(e&&e.code==="rate_limited")addMsg("ai","I'm a bit busy right now — try again in a minute 🫖","err");
    else addMsg("ai","hmm, that didn't quite work. could you try saying it a little differently?","err");
  }).then(function(){busy=false;sendBtn.disabled=false;});}

/* ======================= keyboard & misc ======================= */
document.addEventListener("keydown",function(e){var typing=e.target.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();undo();}
  if(e.key==="n"&&!typing&&!e.metaKey&&!e.ctrlKey&&!focusOpen){var i=document.getElementById("addInput");if(i){e.preventDefault();i.focus();}}
  if(e.key==="f"&&!typing&&!e.metaKey&&!e.ctrlKey&&!focusOpen){e.preventDefault();openFocus(null);}
  if(e.key==="Escape"){panels.forEach(function(p){p.classList.remove("open");});if(focusOpen)closeFocus();}});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h&&h!==view&&(h==="today"||h==="all"||findList(h))){view=h;render();}});
var nameEl=document.getElementById("hiName");nameEl.contentEditable="true";nameEl.spellcheck=false;nameEl.title="click to change your name";
nameEl.onfocus=function(){snapshot();};nameEl.oninput=function(){var v=nameEl.textContent.trim();if(v){data.name=v;queueSave();}};
nameEl.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();nameEl.blur();}};nameEl.onblur=function(){nameEl.textContent=data.name;};
var lastPeriod=null,lastDay=today();
setInterval(function(){if(!data)return;var p=period();if(p!==lastPeriod||today()!==lastDay){lastPeriod=p;lastDay=today();if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable)render();else{applyTheme();greet();}}},30000);

/* ======================= boot ======================= */
buildTools();
function boot(d){if(loaded)return;loaded=true;data=normalize(d||localData());lastPeriod=period();var h=location.hash.slice(1);if(h==="today"||h==="all"||findList(h))view=h;render();
  setTimeout(function(){var up=upcomingImp().filter(function(i){return dayDiff(i.date)<=1;});
    catSay(up.length?fill("hi {n}! "+up[0].title+" is "+countdown(up[0].date).replace("!","")+" — you've got this 🐾"):fill(pick(["hi {n}! 🐾","welcome back, {n} 💛","mrrp! hi {n}"])),3600);},900);}
window.__cosy={parseQuick:function(s){return parseQuick(s);},nextOcc:nextOcc,repeatLabel:repeatLabel,parseRepeatStr:parseRepeatStr,data:function(){return data;}};
var fallback=setTimeout(function(){boot(null);setStatus("saved on this device");},10000);
function useC(name){return(window.claude&&window.claude.use)?Promise.resolve(window.claude.use(name)).catch(function(){return null;}):Promise.resolve(null);}
function connect(){
  useC("sample").then(function(s){sampleApi=s;});
  useC("dictation").then(function(d){if(d){dict=d;wireDict();aiMic.style.display="";if(data)render();}});
  Promise.all([useC("db"),useC("user")]).then(function(r){db=r[0];var user=r[1];
    if(!db||!user){clearTimeout(fallback);boot(null);setStatus("saved on this device");return;}
    return user.id().then(function(id){docRef=db.collection("data/users/"+id).doc("board");
      return docRef.get().then(function(v){clearTimeout(fallback);var d=parseDoc(v);var first=!d;boot(d);if(first||!d.v||d.v<2)saveNow();else setStatus("saved ✓");});});
  }).catch(function(){clearTimeout(fallback);boot(null);setStatus("saved on this device");});}
if(window.claude&&window.claude.use)connect();
else{clearTimeout(fallback);if(tb.ai)tb.ai.style.display="none";boot(null);setStatus("saved on this device");}
})();
</script>
